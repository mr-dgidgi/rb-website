site_name: RecoveryBox
site_url: https://recoverybox.fr/
site_description: Offline emergency server for essential resources
repo_url: https://github.com/mr-dgidgi/recoverybox
repo_name: mr-dgidgi/RecoveryBox

theme:
  name: material
  language: fr
  palette:
    # Day
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    # Night
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: Switch to light mode

extra_css:
  - stylesheets/recoverybox-theme.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mr-dgidgi/recoverybox
      name: GitHub

plugins:
  - search
  - i18n:
      default_language: fr
      languages:
        - locale: fr
          name: Français
          default: true
          build: true
        - locale: en
          name: English
          build: true
      nav_translations:
        fr:
          Accueil: Accueil
          Blog: Blog
          Wiki: Wiki
        en:
          Accueil: Home
          Blog: Blog
          Wiki: Wiki
  - blog:
      blog_dir: blog
      post_dir: blog/posts
nav:
  - Accueil: index.md
  - Blog: blog/index.md
  - Wiki: https://recoverybox.fr/wiki/

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
