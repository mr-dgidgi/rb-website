site_name: RecoveryBox
site_url: https://recoverybox.fr/
site_description: Offline emergency server for essential resources
repo_url: https://github.com/mr-dgidgi/recoverybox
repo_name: mr-dgidgi/RecoveryBox

theme:
  name: material
  custom_dir: docs/.overrides
  palette:
    # Day
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    # Night
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow

extra_css:
  - stylesheets/recoverybox-theme.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mr-dgidgi/recoverybox
      name: GitHub

markdown_extensions:
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - def_list

plugins:
  - search
  - privacy
  - i18n:
      reconfigure_material: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: fr
          name: Français
          build: true
  - blog:
      blog_dir: blog
      post_date_format: long
      post_url_format: "{slug}"
      authors_file: blog/authors.yml
      categories: true
      pagination_per_page: 10

nav:
  - Home: index.md
  - Wiki: wiki/index.md
  - Blog: blog/index.md
